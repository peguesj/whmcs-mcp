name: Deploy Pages

# Builds and publishes the site/ marketing page to GitHub Pages.
# Triggered on pushes to main that touch the site content, plus manual dispatch.
# Requires GitHub Pages to be configured with "Source: GitHub Actions" in the
# repository settings (Settings -> Pages -> Build and deployment -> Source).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/tools.md"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; new pushes cancel an in-flight run, but never
# cancel a deployment that is already in progress being applied.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate docs/tools.md and site/data/tools.json
        run: npm run gen:docs

      - name: Fail if generated docs are out of date
        run: |
          if [ -n "$(git status --porcelain docs/tools.md site/data/tools.json 2>/dev/null)" ]; then
            echo "::error::docs/tools.md or site/data/tools.json is out of date. Run 'npm run gen:docs' and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
