name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Generate docs
        run: npm run gen:docs

      - name: Check generated docs are up to date (no drift)
        run: |
          if ! git diff --quiet -- docs/tools.md site/data/tools.json; then
            echo "::error::Generated docs are out of date. Run 'npm run gen:docs' locally and commit the result."
            git --no-pager diff -- docs/tools.md site/data/tools.json
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: npm pack (dry run)
        run: npm pack --dry-run

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for obvious secret patterns
        run: |
          set -euo pipefail
          # Fail on anything that looks like a live WHMCS credential or a
          # generic high-entropy secret assignment committed to the tree.
          # .env.example is expected to contain only placeholders.
          #
          # The negative lookahead excludes source-code property-access
          # assignments (e.g. `env.WHMCS_API_ACCESS_KEY = credentials.accessKey;`
          # in test/mock-whmcs-server.ts), which match the identifier-shaped
          # part of this pattern without being a literal secret: a real
          # committed literal is never immediately followed by `.<identifier>`.
          # Requires -P (PCRE) for lookahead support; GNU grep on ubuntu-latest
          # supports this.
          if grep -RInP \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=dist \
              --exclude-dir=coverage \
              'WHMCS_API_(IDENTIFIER|SECRET|ACCESS_KEY)\s*=\s*[A-Za-z0-9]{8,}(?!\.)' \
              . ; then
            echo "::error::Possible committed WHMCS credential detected."
            exit 1
          fi
          echo "No obvious secret patterns found."
